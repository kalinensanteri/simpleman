<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpleman · Contact</title>
<!-- Tinos has the same letter widths as Times New Roman; it is used only where Times New Roman is missing (e.g. Android) so layouts stay identical -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow-x: hidden; }
  /* Clip the scaled artboard so phones cannot scroll past the end of the page */
  body { overflow: hidden; }
  body { font-family: 'Times New Roman', Tinos, Times, serif; color: #111; }

  /* 1440px artboard (measured from "Desktop - 34.png"), scaled to the viewport width */
  .page { position: relative; width: 1440px; height: 812px; transform-origin: 0 0; }
  .abs { position: absolute; display: block; }

  .hat { left: 36px; top: 32px; width: 52px; }

  .intro { left: 478px; top: 266.5px; font-size: 22px; line-height: 27px; white-space: nowrap; }

  .person { width: 119px; height: 113px; }
  .p1 { left: 479px; top: 391px; }
  .p2 { left: 698px; top: 391px; }

  .name  { top: 516px; font-size: 13.2px; line-height: 13.2px; white-space: nowrap; }
  .email { top: 531px; font-size: 14px; line-height: 14px; white-space: nowrap; color: #b8b8b8; text-decoration: none; }
  .email:hover { color: #777; }
  .n1, .e1 { left: 479.5px; }
  .n2, .e2 { left: 698.5px; }

  /* Phone layout (< 700px): the script zooms onto the content column (x 439–1002),
     so these artboard sizes appear ~67% as large on a 375px-wide phone. */
  .page.m { height: 520px; }
  .m .hat { left: 457px; top: 30px; width: 76px; }
  .m .intro { top: 185.5px; }
  .m .p1, .m .p2 { top: 310px; }
  .m .name  { top: 435px; font-size: 20px; line-height: 20px; }
  .m .email { top: 459px; font-size: 20px; line-height: 20px; }
</style>
</head>
<body>
<div class="page" id="page">
  <a href="index.html" aria-label="Simpleman home"><img class="abs hat" src="img/hat.png" alt="Simpleman"></a>

  <p class="abs intro">We are a two-person team located in Helsinki, Finland.<br>You can contact us on any matters.</p>

  <img class="abs person p1" src="img/person1.png" alt="Niilo Tallberg">
  <p class="abs name n1">Niilo Tallberg</p>
  <a class="abs email e1" href="mailto:tallbergniilo@gmail.com">tallbergniilo@gmail.com</a>

  <img class="abs person p2" src="img/person2.png" alt="Santeri Kalinen">
  <p class="abs name n2">Santeri Kalinen</p>
  <a class="abs email e2" href="mailto:kalinensanteri@gmail.com">kalinensanteri@gmail.com</a>
</div>
<script>
  (function () {
    var page = document.getElementById('page');
    // Desktop: show the whole 1440px artboard. Phone: zoom onto the content column.
    var DESKTOP = { x: 0, w: 1440, h: 812 }, PHONE = { x: 439, w: 563, h: 520 };
    function fit() {
      var vw = document.documentElement.clientWidth;
      var phone = vw < 700, v = phone ? PHONE : DESKTOP, s = vw / v.w;
      page.classList.toggle('m', phone);
      page.style.transform = 'scale(' + s + ') translateX(' + (-v.x) + 'px)';
      document.body.style.height = (v.h * s) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
