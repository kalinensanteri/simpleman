<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpleman · Waitlist</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow-x: hidden; }
  /* Clip the scaled artboard so phones cannot scroll past the end of the page */
  body { overflow: hidden; }
  body { font-family: 'Times New Roman', Times, serif; color: #111; }

  /* 1440px artboard (measured from "Desktop - 22.png"), scaled to the viewport width */
  .page { position: relative; width: 1440px; height: 1841px; transform-origin: 0 0; }
  .abs { position: absolute; display: block; }

  .hat { left: 680px; top: 88px; width: 76px; }

  h1.abs { left: 111px; top: 314px; font-weight: normal; font-size: 53px; line-height: 53px; white-space: nowrap; }

  label.abs { left: 109px; font-size: 22.75px; line-height: 22.75px; white-space: nowrap; }
  .field {
    left: 109px; width: 771px; height: 48px;
    background: #e8e8e8; border: 2px solid #cfcfcf; border-radius: 0;
    font: 20px 'Times New Roman', Times, serif; color: #111; padding: 0 14px; outline: none;
  }
  .field:focus { border-color: #9a9a9a; }

  .l1 { top: 477px; }  .f1 { top: 508px; }
  .l2 { top: 614px; }  .f2 { top: 645px; }
  .l3 { top: 751px; }  .f3 { top: 782px; }
  .l4 { top: 881px; }  .f4 { top: 912px; }
  .l5 { top: 1011px; } .f5 { top: 1041px; }

  .send {
    left: 109px; top: 1130px; width: 120px; height: 34px;
    border: 2px solid #d8d8d8; background: #fff; cursor: pointer;
    font: 17px/30px 'Times New Roman', Times, serif; color: #111;
  }
  .send:hover { border-color: #a0a0a0; }
  .note { left: 245px; top: 1139px; font-size: 15px; color: #999; }

  /* Phone layout (< 700px): plain top-to-bottom form at real size (no artboard scaling).
     Text stays >= 16px so iOS doesn't zoom in when a field is tapped. */
  .page.m { width: auto; height: auto; padding: 36px 20px 64px; }
  .m .abs { position: static; }
  .m .home { display: block; width: 52px; margin: 0 auto 56px; }
  .m .hat { width: 52px; }
  .m h1.abs { font-size: 30px; line-height: 34px; white-space: normal; margin-bottom: 36px; }
  .m label.abs { font-size: 17px; line-height: 22px; white-space: normal; margin-bottom: 8px; }
  .m .field { width: 100%; height: 46px; font-size: 16px; margin-bottom: 26px; }
  .m .send { width: 120px; height: 42px; font-size: 18px; line-height: 38px; margin-top: 4px; }
  .m .note { margin-top: 12px; font-size: 16px; }
</style>
</head>
<body>
<div class="page" id="page">
  <a class="home" href="index.html" aria-label="Simpleman home"><img class="abs hat" src="img/hat-faint.png" alt="Simpleman"></a>

  <h1 class="abs">Glad to see you care.</h1>

  <form id="waitlist">
    <label class="abs l1" for="based">Where are you based?</label>
    <input class="abs field f1" id="based" name="based" type="text" autocomplete="address-level2">

    <label class="abs l2" for="about">What is your institution about?</label>
    <input class="abs field f2" id="about" name="about" type="text" autocomplete="organization">

    <label class="abs l3" for="people">How many people in your team would consume simpleman and in what quantities?</label>
    <input class="abs field f3" id="people" name="people" type="text">

    <label class="abs l4" for="else">Anything else?</label>
    <input class="abs field f4" id="else" name="anything_else" type="text">

    <!-- honeypot: hidden from people, bots tend to fill it -->
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

    <label class="abs l5" for="email">Email</label>
    <input class="abs field f5" id="email" name="email" type="email" autocomplete="email" required>

    <button class="abs send" type="submit">send</button>
    <p class="abs note" id="note"></p>
  </form>
</div>
<script>
  (function () {
    var page = document.getElementById('page');
    // Desktop: scale the 1440px artboard. Phone: plain flowing layout (see .m styles).
    function fit() {
      var vw = document.documentElement.clientWidth, phone = vw < 700;
      page.classList.toggle('m', phone);
      if (phone) {
        page.style.transform = 'none';
        document.body.style.height = 'auto';
      } else {
        var s = vw / 1440;
        page.style.transform = 'scale(' + s + ')';
        document.body.style.height = (1841 * s) + 'px';
      }
    }
    window.addEventListener('resize', fit);
    fit();

    // Save the submission to the dataroom (Cloudflare Worker + D1, see /worker).
    var form = document.getElementById('waitlist');
    var note = document.getElementById('note');
    var button = form.querySelector('.send');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      button.disabled = true;
      note.style.color = '#999';
      note.textContent = 'Sending…';
      fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (!res.ok || !data.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
          });
        })
        .then(function () {
          form.reset();
          note.style.color = '#111';
          note.textContent = "Thank you. You're on the list.";
        })
        .catch(function (err) {
          note.style.color = '#a33';
          note.textContent = err.message && err.message.indexOf('fetch') === -1
            ? err.message : 'Could not send. Please try again.';
        })
        .then(function () { button.disabled = false; });
    });
  })();
</script>
</body>
</html>
