<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpleman</title>
<!-- Tinos has the same letter widths as Times New Roman; it is used only where Times New Roman is missing (e.g. Android) so layouts stay identical -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow-x: hidden; }
  /* Clip the scaled artboard so phones cannot scroll past the end of the page */
  body { overflow: hidden; }
  body { font-family: 'Times New Roman', Tinos, Times, serif; color: #111; }

  /* 1440px artboard (measured from "Desktop - 35.png"), scaled to the viewport width.
     Desktop shows it zoomed out to ~79% and centred, so the content has wide side margins. */
  .page { position: relative; width: 1440px; height: 1981px; transform-origin: 0 0; }
  .abs { position: absolute; display: block; }

  /* Desktop zoom depends on the screen (see the script); the script sets these so the logo
     always sits ~31px from the top-left corner at the same on-screen size */
  .logo  { left: var(--logo-left, -173px); top: var(--logo-top, 52px); width: var(--logo-w, 112px); }
  /* Screen 1: the "humanity-focused nutrition" title alone, centred (--title-top is set by the script) */
  .title { left: 455px; width: 495px; top: var(--title-top, 274px); }

  /* Newspaper-style column: left-aligned text with a drop cap spanning three lines */
  .mission { left: 194px; top: 625.4px; font-size: 29.1px; line-height: 32px; }
  .mission span { display: block; width: 426px; text-align: left; }
  .mission span::first-letter { float: left; font-size: 126px; line-height: 95px; margin: 0 14px 0 -2px; }

  .tile { border: 2px solid #707070; object-fit: cover; }
  .meal-a { left: 733px;  top: 570px; width: 243px; height: 243px; }
  .meal-b { left: 1048px; top: 568px; width: 243px; height: 243px; }
  .meal-c { left: 103px;  top: 890px; width: 243px; height: 243px; }
  .meal-d { left: 418px;  top: 888px; width: 243px; height: 243px; }
  .ingredients { left: 733px; top: 888px; width: 558px; height: 347px; }

  /* "join waitlist" button in the space under the ingredients photo, where the faces drawing was.
     A full-width wrapper centres it (the .below fade/shift already uses transform). */
  .joinwrap { left: 733px; width: 558px; top: 1395.5px; text-align: center; }
  .joinwrap a { display: inline-block; padding: 0 1.15em; height: 55px; border: 2px solid #d8d8d8; background: #fff;
    font: 27.5px/51px 'Times New Roman', Tinos, Times, serif; color: #111; text-decoration: none; white-space: nowrap; }
  .joinwrap a:hover { border-color: #a0a0a0; }
  /* Phone: the layout is shrunk to fit, so make the button bigger to stay readable and tappable */
  .m .joinwrap { top: 1373px; }
  .m .joinwrap a { height: 100px; font-size: 48px; line-height: 96px; border-width: 3px; }

  .nutrition { left: 103px; top: 1211px; width: 558px; height: 347px; background: #e8e8e8; border: 2px solid #5b5b5b; }
  .label  { left: 83px; top: 62px; width: 387px; height: 219px; background: #fff; border: 2px solid #747474; }
  .macros { left: 66.5px; top: 46.6px; font: 23.4px/28px 'Times New Roman', Tinos, Times, serif; color: #000; }
  .card   { left: 184px; top: 42.5px; width: 129.5px; }


  /* Footer: "contact us", the flower drawing and "pursuit of real" sit on one line */
  /* Footer row and "Made In Finland" share the photo grid's centre line (x 697) */
  .footer { left: 0; top: 1879px; width: 1394px; height: 40px; display: flex; justify-content: center; align-items: flex-end; }
  .footer a { color: #111; text-decoration: none; font-size: 27.5px; line-height: 27.5px; white-space: nowrap; }
  .footer a:hover { text-decoration: underline; }
  .footer img { display: block; width: 39.5px; margin: 0 24.5px 2px 13.5px; }
  .made { left: 0; top: 1942.7px; width: 1394px; text-align: center; font: 18.4px/18.4px 'Times New Roman', Tinos, Times, serif; color: #8a8a8a; }

  /* Intro (desktop and phone): the first screen shows only the logo and the title (centred
     vertically); everything marked .below is pushed under the fold by --shift and fades in
     when scrolled to. The script sets these per screen size. */
  .page .below { transform: translateY(var(--shift, 0px)); }
  .page.reveal .below { opacity: 0; transition: opacity 0.9s ease; }
  .page.reveal .below.in { opacity: 1; }

</style>
</head>
<body>
<div class="page" id="page">
  <img class="abs logo" src="img/hat.png" alt="Simpleman">
  <img class="abs title" src="img/title.png" alt="humanity-focused nutrition">

  <p class="abs below mission"><span>Wherever people put their minds and bodies on the line at work, nutritious, minimally processed food should be available.</span></p>

  <img class="abs below tile grid meal-a" src="img/meal3.jpg" alt="Beef bowl">
  <img class="abs below tile grid meal-b" src="img/meal4.jpg" alt="Beef bowl from above">
  <img class="abs below tile grid meal-c" src="img/meal1.jpg" alt="Chicken bowl">
  <img class="abs below tile grid meal-d" src="img/meal2.jpg" alt="Chicken bowl from above">
  <img class="abs below tile grid ingredients" src="img/ingredients.jpg" alt="Raw ingredients">

  <div class="abs below grid nutrition">
    <div class="abs label">
      <div class="abs macros">750K<br>49P<br>65C<br>28F</div>
      <img class="abs card" src="img/card.png" alt="Ingredients: sweet potatoes, carrots, beef, eggs, eggplant, broccoli, spices (salt, pepper)">
    </div>
  </div>

  <div class="abs below grid joinwrap"><a href="waitlist.html">join waitlist</a></div>

  <nav class="abs below footer"><a href="contact.html">contact us</a><img src="img/flower.png" alt=""><a href="manifesto.html">pursuit of real</a></nav>
  <p class="abs below made">Made In Finland</p>
</div>
<script>
  (function () {
    var page = document.getElementById('page');
    // Two screens on every device. Screen 1 = logo + the "humanity-focused nutrition" title, centred. Screen 2 = the
    // text, photos and footer, zoomed so the whole block fits the screen height and centred.
    //   Desktop: never wider than ~65% of the screen, so there are wide side margins.
    //   Phone:   the photo grid fills the width with ~24px side margins.
    var TITLE_H = 76;       // height of the title image in artboard px
    var CONTENT_TOP = 568;  // top of the first photo row
    var CONTENT_H = 1389;   // first photo row down to "Made In Finland"
    var FIT_H = 1560;       // CONTENT_H plus breathing room above and below
    var CENTER_X = 697;     // horizontal centre of the photo grid
    var DESKTOP = { maxW: 1820, logo: { left: 36, top: 32, w: 52 } };
    var PHONE   = { maxW: 1362, logo: { left: 24, top: 24, w: 40 } };
    var lastW = 0, lastH = 0;
    function fit() {
      var vw = document.documentElement.clientWidth, vh = window.innerHeight;
      var phone = vw < 700;
      // Phone browsers resize the screen height while scrolling (address bar); ignore that so
      // the page doesn't jump, and only refit when the width actually changes.
      if (phone && vw === lastW && lastH) vh = lastH;
      lastW = vw; lastH = vh;
      var v = phone ? PHONE : DESKTOP;
      page.classList.toggle('m', phone);
      var s = Math.min(vw / v.maxW, vh / FIT_H);
      var x0 = CENTER_X - vw / (2 * s);   // artboard x shown at the left edge of the screen
      var screenH = vh / s;               // one screen height in artboard px
      page.style.setProperty('--title-top', Math.round((screenH - TITLE_H) / 2) + 'px');
      // Centre the content block vertically within the second screen
      var shift = Math.round(screenH + (screenH - CONTENT_H) / 2 - CONTENT_TOP);
      page.style.setProperty('--shift', shift + 'px');
      page.style.setProperty('--logo-left', (x0 + v.logo.left / s) + 'px');
      page.style.setProperty('--logo-top', (v.logo.top / s) + 'px');
      page.style.setProperty('--logo-w', (v.logo.w / s) + 'px');
      page.style.transform = 'scale(' + s + ') translateX(' + (-x0) + 'px)';
      document.body.style.height = (2 * vh) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();

    // Desktop: fade each part in once it has scrolled into view (or been scrolled past,
    // e.g. after jumping straight to the bottom), so nothing can stay hidden.
    var hidden = Array.prototype.slice.call(document.querySelectorAll('.below'));
    var queued = false;
    function reveal() {
      queued = false;
      var limit = window.innerHeight * 0.9;
      // At the very bottom of the page, show everything (the footer never reaches the 90% line)
      var atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 4;
      hidden = hidden.filter(function (el) {
        if (atBottom || el.getBoundingClientRect().top < limit) { el.classList.add('in'); return false; }
        return true;
      });
      if (!hidden.length) window.removeEventListener('scroll', onScroll);
    }
    function onScroll() { if (!queued) { queued = true; requestAnimationFrame(reveal); } }
    page.classList.add('reveal');
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    reveal();
  })();
</script>
</body>
</html>
