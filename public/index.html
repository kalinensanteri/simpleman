<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpleman</title>
<!-- Tinos has the same letter widths as Times New Roman; it is used only where Times New Roman is missing (e.g. Android) so layouts stay identical -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow-x: hidden; }
  /* Clip the scaled artboard so phones cannot scroll past the end of the page */
  body { overflow: hidden; }
  body { font-family: 'Times New Roman', Tinos, Times, serif; color: #111; }

  /* 1440px artboard (measured from "Desktop - 35.png"), scaled to the viewport width */
  .page { position: relative; width: 1440px; height: 1981px; transform-origin: 0 0; }
  .abs { position: absolute; display: block; }

  .logo  { left: 30px; top: 41px; width: 89px; }
  .title { left: 455px; top: 274px; width: 495px; }

  /* Newspaper-style column: left-aligned text with a drop cap spanning three lines */
  .mission { left: 194px; top: 625.4px; font-size: 29.1px; line-height: 32px; }
  .mission span { display: block; width: 442px; text-align: left; }
  .mission span::first-letter { float: left; font-size: 142px; line-height: 78px; margin: 17.7px 14px 0 -2px; }

  .tile { border: 2px solid #707070; object-fit: cover; }
  .meal-a { left: 733px;  top: 570px; width: 243px; height: 243px; }
  .meal-b { left: 1048px; top: 568px; width: 243px; height: 243px; }
  .meal-c { left: 103px;  top: 890px; width: 243px; height: 243px; }
  .meal-d { left: 418px;  top: 888px; width: 243px; height: 243px; }
  .ingredients { left: 733px; top: 888px; width: 558px; height: 347px; }

  .nutrition { left: 103px; top: 1211px; width: 558px; height: 347px; background: #e8e8e8; border: 2px solid #5b5b5b; }
  .label  { left: 83px; top: 62px; width: 387px; height: 219px; background: #fff; border: 2px solid #747474; }
  .macros { left: 66.5px; top: 46.6px; font: 23.4px/28px 'Times New Roman', Tinos, Times, serif; color: #000; }
  .card   { left: 184px; top: 42.5px; width: 129.5px; }

  .faces { left: 926px; top: 1396px; width: 169.5px; }

  /* Footer: "contact us", the flower drawing and "pursuit of real" sit on one line */
  .footer { left: 0; top: 1879px; width: 1433px; height: 40px; display: flex; justify-content: center; align-items: flex-end; }
  .footer a { color: #111; text-decoration: none; font-size: 27.5px; line-height: 27.5px; white-space: nowrap; }
  .footer a:hover { text-decoration: underline; }
  .footer img { display: block; width: 39.5px; margin: 0 24.5px 2px 13.5px; }
  .made { left: 0; top: 1942.7px; width: 1392px; text-align: center; font: 18.4px/18.4px 'Times New Roman', Tinos, Times, serif; color: #8a8a8a; }

  /* Phone layout (< 700px): the script zooms onto the photo grid (x 16–1378), so these sizes are
     in artboard pixels and appear ~28% as large on a 375px-wide phone. The text moves above the
     photos so it stays readable; the grid moves down to make room. */
  .page.m { height: 2074px; }
  .m .logo  { left: 103px; top: 60px; width: 200px; }
  .m .title { left: 247px; top: 190px; width: 900px; }
  .m .mission { left: 295px; top: 420px; font-size: 53px; line-height: 58px; }
  .m .mission span { width: 805px; }
  .m .mission span::first-letter { font-size: 257px; line-height: 141px; margin: 32px 25px 0 -4px; }
  .m .grid { transform: translateY(251px); }
  .m .meal-a, .m .meal-b { transform: translate(-315px, 251px); }
  .m .footer { top: 1888px; width: 1394px; height: 73px; }
  .m .footer a { font-size: 50px; line-height: 50px; }
  .m .footer img { width: 72px; margin: 0 45px 4px 25px; }
  .m .made { top: 1991px; font-size: 33px; line-height: 33px; }
</style>
</head>
<body>
<div class="page" id="page">
  <img class="abs logo" src="img/logo.png" alt="Simpleman">
  <img class="abs title" src="img/title.png" alt="humanity-focused nutrition">

  <p class="abs mission"><span>Wherever people put their minds and bodies on the line at work, nutritious, minimally processed food should be available.</span></p>

  <img class="abs tile grid meal-a" src="img/meal3.jpg" alt="Beef bowl">
  <img class="abs tile grid meal-b" src="img/meal4.jpg" alt="Beef bowl from above">
  <img class="abs tile grid meal-c" src="img/meal1.jpg" alt="Chicken bowl">
  <img class="abs tile grid meal-d" src="img/meal2.jpg" alt="Chicken bowl from above">
  <img class="abs tile grid ingredients" src="img/ingredients.jpg" alt="Raw ingredients">

  <div class="abs grid nutrition">
    <div class="abs label">
      <div class="abs macros">750K<br>49P<br>65C<br>28F</div>
      <img class="abs card" src="img/card.png" alt="Ingredients: sweet potatoes, carrots, beef, eggs, eggplant, broccoli, spices (salt, pepper)">
    </div>
  </div>
  <img class="abs grid faces" src="img/faces.png" alt="">

  <nav class="abs footer"><a href="contact.html">contact us</a><img src="img/flower.png" alt=""><a href="manifesto.html">pursuit of real</a></nav>
  <p class="abs made">Made In Finland</p>
</div>
<script>
  (function () {
    var page = document.getElementById('page');
    // Desktop: show the whole 1440px artboard. Phone: zoom onto the photo grid.
    var DESKTOP = { x: 0, w: 1440, h: 1981 }, PHONE = { x: 16, w: 1362, h: 2074 };
    function fit() {
      var vw = document.documentElement.clientWidth;
      var phone = vw < 700, v = phone ? PHONE : DESKTOP, s = vw / v.w;
      page.classList.toggle('m', phone);
      page.style.transform = 'scale(' + s + ') translateX(' + (-v.x) + 'px)';
      document.body.style.height = (v.h * s) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
