<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simpleman</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; overflow-x: hidden; }
  /* Clip the scaled artboard so phones cannot scroll past the end of the page */
  body { overflow: hidden; }
  body { font-family: 'Times New Roman', Times, serif; color: #111; }

  /* 1440px artboard (measured from "Desktop - 31.png"), scaled to the viewport width */
  .page { position: relative; width: 1440px; height: 1774px; transform-origin: 0 0; }
  .abs { position: absolute; display: block; }

  .logo { left: 39px; top: 49px; width: 89px; }
  .hero { left: 0; top: 104px; width: 1440px; height: 416px; object-fit: cover; }
  .caption { left: 22px; top: 494px; font-size: 12px; line-height: 12px; color: #fff; opacity: 0.5; white-space: nowrap; }

  .mission {
    left: 0; top: 647px; width: 1440px; text-align: center;
    font-size: 22px; line-height: 24px;
  }
  .mission span { display: inline-block; }

  .waitlist {
    left: 571px; top: 745px; width: 297px; height: 34px;
    border: 2px solid #d8d8d8; background: #fff;
    font: 17px/30px 'Times New Roman', Times, serif; color: #111;
    text-align: center; text-decoration: none; cursor: pointer;
  }
  .waitlist:hover { border-color: #a0a0a0; }

  .tile { border: 2px solid #707070; object-fit: cover; }
  .meal-a { left: 534px; top: 930px;  width: 160px; height: 160px; }
  .meal-b { left: 744px; top: 930px;  width: 160px; height: 160px; }
  .meal-c { left: 327px; top: 1108px; width: 160px; height: 160px; }
  .meal-d { left: 534px; top: 1107px; width: 160px; height: 160px; }
  .ingredients { left: 744px; top: 1109px; width: 368px; height: 223px; }

  .flower { left: 370px; top: 984px; width: 62px; }
  .globe  { left: 978px; top: 980px; width: 54px; }
  .faces  { left: 872px; top: 1425px; width: 110px; }

  .nutrition { left: 327px; top: 1286px; width: 367px; height: 222px; background: #e8e8e8; border: 2px solid #707070; }
  .label { left: 54px; top: 37px; width: 253px; height: 144px; background: #fff; border: 2px solid #707070; }
  .macros { left: 44px; top: 32px; font: 15px/18px 'Times New Roman', Times, serif; color: #000; }
  .card { left: 119px; top: 28px; width: 84px; }

  .strip { left: 439px; top: 1568px; width: 563px; height: 66px; border: 2px solid #707070; object-fit: cover; }

  .footer-links { left: 0; top: 1704px; width: 1440px; text-align: center; font-size: 17px; line-height: 18px; }
  .footer-links a { color: #111; text-decoration: none; margin: 0 11px; }
  .footer-links a:hover { text-decoration: underline; }
  .made { left: 0; top: 1738px; width: 1440px; text-align: center; font: 11px/12px 'Times New Roman', Times, serif; color: #999; }

  /* Phone layout (< 700px): the script zooms onto the content column (x 269–1169), so these
     sizes are in artboard pixels and appear ~42% as large on a 375px-wide phone. */
  .page.m { height: 1868px; }
  .m .logo { left: 327px; top: 40px; width: 130px; }
  .m .caption { left: 293px; top: 472px; font-size: 24px; line-height: 24px; }
  .m .mission { top: 619px; font-size: 35px; line-height: 39px; }
  /* Phone: narrower, balanced hero text instead of the desktop line breaks */
  .m .mission span { width: 640px; text-wrap: balance; }
  .m .mission br { display: none; }
  /* Phone: editorial drop cap, left-aligned like a newspaper column */
  .m .mission span { width: 520px; text-align: left; text-wrap: pretty; }
  .m .mission span::first-letter {
    float: left; font-size: 152px; line-height: 108px;
    margin: 6px 14px 0 -5px;
  }
  /* Phone: photo chunk moves up into the button's old spot; the button goes below the chunk */
  .m .chunk { transform: translateY(-18px); }
  .m .waitlist { left: 469px; top: 1530px; width: 502px; height: 62px; font-size: 30px; line-height: 58px; }
  .m .strip { top: 1652px; }
  .m .footer-links { top: 1754px; font-size: 32px; line-height: 34px; }
  .m .footer-links a { margin: 0 18px; }
  .m .made { top: 1810px; font-size: 20px; line-height: 22px; }
</style>
</head>
<body>
<div class="page" id="page">
  <img class="abs logo" src="img/logo.png" alt="Simpleman">
  <img class="abs hero" src="img/hero-31.jpg" alt="Finnish forest lake">
  <p class="abs caption">Kuhmo, Finland</p>

  <p class="abs mission"><span>Wherever people put their minds and bodies on the line <br>at work, nutritious, minimally processed food should be <br>available.</span></p>

  <a class="abs waitlist" href="waitlist.html">sign up for waitlist to get early access</a>

  <img class="abs chunk flower" src="img/flower.png" alt="">
  <img class="abs tile chunk meal-a" src="img/meal3.jpg" alt="Beef bowl">
  <img class="abs tile chunk meal-b" src="img/meal4.jpg" alt="Beef bowl from above">
  <img class="abs chunk globe" src="img/globe.png" alt="">

  <img class="abs tile chunk meal-c" src="img/meal1.jpg" alt="Chicken bowl">
  <img class="abs tile chunk meal-d" src="img/meal2.jpg" alt="Chicken bowl from above">
  <img class="abs tile chunk ingredients" src="img/ingredients.jpg" alt="Raw ingredients">

  <div class="abs chunk nutrition">
    <div class="abs label">
      <div class="abs macros">750K<br>49P<br>65C<br>28F</div>
      <img class="abs card" src="img/card.png" alt="Ingredients: sweet potatoes, carrots, beef, eggs, eggplant, broccoli, spices (salt, pepper)">
    </div>
  </div>
  <img class="abs chunk faces" src="img/faces.png" alt="">

  <img class="abs strip" src="img/strip.jpg" alt="People at work and play">

  <nav class="abs footer-links"><a href="contact.html">contact us</a><a href="manifesto.html">manifesto</a></nav>
  <p class="abs made">Made In Finland</p>
</div>
<script>
  (function () {
    var page = document.getElementById('page');
    // Desktop: show the whole 1440px artboard. Phone: zoom onto the content column.
    var DESKTOP = { x: 0, w: 1440, h: 1774 }, PHONE = { x: 269, w: 900, h: 1868 };
    function fit() {
      var vw = document.documentElement.clientWidth;
      var phone = vw < 700, v = phone ? PHONE : DESKTOP, s = vw / v.w;
      page.classList.toggle('m', phone);
      page.style.transform = 'scale(' + s + ') translateX(' + (-v.x) + 'px)';
      document.body.style.height = (v.h * s) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
